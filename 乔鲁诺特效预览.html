<script>
/* ============================================================================
 * 乔鲁诺·乔巴纳 —— 技能特效层（并入「脑花乔尼」合并扩展）
 * ----------------------------------------------------------------------------
 * 视觉语言（依据角色设定）：
 *   赋予生命（藤蔓 / 绽放）· 金绿双色 · 瓢虫壳（黄金反甲）· 虫箭贯穿 · 归零
 * 纯 DOM/CSS + WAAPI + Canvas，不依赖外部图片。
 * 所有入口都吞异常：特效出错绝不中断结算。
 * ========================================================================== */

const LAYER_ID = "jojo-fx";
const TOP_ID = "jojo-fx-top";
const STYLE_ID = "jojo-fx-style";
const CFG_KEY = "extension_脑花乔尼_jojo_fx";
const CFG_SFX = "extension_脑花乔尼_jojo_sfx";
const AUDIO_BASE = "extension/脑花乔尼/audio/fx/";

const GOLD = "rgba(232,178,58,.95)";
const GOLD_L = "rgba(255,224,138,1)";
const GREEN = "rgba(63,164,91,.95)";
const GREEN_L = "rgba(123,224,138,1)";
const WHITE = "rgba(246,240,226,.98)";

const CSS_TEXT = `
#jojo-fx{position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:9;overflow:hidden}
#jojo-fx *{box-sizing:border-box;pointer-events:none}
#jojo-fx-top{position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:9999;overflow:hidden}
#jojo-fx-top *{box-sizing:border-box;pointer-events:none}

@keyframes jojoSpin{to{transform:rotate(360deg)}}
@keyframes jojoFade{to{opacity:1}}

/* 通用金绿涟漪 */
.jojo-ring{position:absolute;border-radius:50%;border:2px solid rgba(123,224,138,.9);
	box-shadow:0 0 18px rgba(123,224,138,.85),inset 0 0 22px rgba(63,164,91,.5);
	transform:translate(-50%,-50%) scale(.3);opacity:.95;
	animation:jojoRing .55s cubic-bezier(.2,.75,.3,1) forwards}
@keyframes jojoRing{60%{opacity:.7}100%{transform:translate(-50%,-50%) scale(1.55);opacity:0}}

/* 飘字 */
.jojo-float{position:absolute;transform:translate(-50%,-50%);font-weight:700;white-space:nowrap;opacity:0;
	text-shadow:0 0 10px rgba(63,164,91,.95),0 0 22px rgba(232,178,58,.7),0 1px 2px rgba(0,0,0,.9);
	animation:jojoFloat 1.1s ease-out forwards}
@keyframes jojoFloat{0%{opacity:0;transform:translate(-50%,-50%) scale(.8)}
	16%{opacity:1;transform:translate(-50%,-58%) scale(1)}
	100%{opacity:0;transform:translate(-50%,-134%) scale(.96)}}

.jojo-spark{position:absolute;width:6px;height:6px;border-radius:50%;opacity:0;
	background:radial-gradient(circle,#fff 0%,rgba(255,224,138,.95) 40%,rgba(63,164,91,0) 72%);
	box-shadow:0 0 10px rgba(255,224,138,.9);
	animation:jojoSpark .7s ease-out forwards}
@keyframes jojoSpark{0%{opacity:0;transform:translate(0,0) scale(.4)}
	25%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.3)}}

.jojo-vine{position:absolute;bottom:0;width:5px;height:0;border-radius:3px 3px 0 0;

	80%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1) rotate(-6deg)}}

/* 归零的 0 */
.jojo-zero{position:absolute;transform:translate(-50%,-50%);font-size:210px;font-weight:900;line-height:1;
	color:rgba(255,224,138,1);opacity:0;

@keyframes jojoZero{0%{opacity:0;transform:translate(-50%,-50%) scale(3.4) rotate(-12deg);filter:blur(18px)}
	34%{opacity:1;filter:blur(0)}
	52%{transform:translate(-50%,-50%) scale(.92) rotate(0)}

	100%{opacity:0;transform:translate(-50%,-50%) scale(1)}}

/* 全屏白闪 */
.jojo-flash{position:absolute;left:0;top:0;width:100%;height:100%;mix-blend-mode:screen;

@keyframes jojoFlash{0%{opacity:0}6%{opacity:.98}100%{opacity:0}}

	animation:jojoDim 3.4s ease-out forwards}
@keyframes jojoDim{0%{opacity:0}8%{opacity:1}84%{opacity:1}100%{opacity:0}}

/* 光柱：金白 */
.jojo-pillar{position:absolute;top:-10%;width:26vmin;height:120%;opacity:0;transform-origin:50% 0;
	background:linear-gradient(180deg,rgba(255,214,107,0) 0%,rgba(255,214,107,.55) 22%,rgba(255,255,250,.98) 52%,rgba(232,178,58,.55) 80%,rgba(232,178,58,0) 100%);

@keyframes jojoPillar{0%{opacity:0;transform:scaleY(.2)}14%{opacity:1;transform:scaleY(1)}
	70%{opacity:.9}100%{opacity:0}}

/* 黄金十字放射光 */
.jojo-rays{position:absolute;left:50%;top:50%;width:200vmax;height:200vmax;margin:-100vmax 0 0 -100vmax;
	opacity:0;transform-origin:50% 50%;

	-webkit-mask:radial-gradient(circle,rgba(0,0,0,.95) 4%,rgba(0,0,0,.75) 22%,rgba(0,0,0,.15) 46%,transparent 62%);
	mask:radial-gradient(circle,rgba(0,0,0,.95) 4%,rgba(0,0,0,.75) 22%,rgba(0,0,0,.15) 46%,transparent 62%);
	animation:jojoRays 3.2s cubic-bezier(.2,.8,.2,1) forwards,qjojoRaySpin 9s linear infinite}
@keyframes jojoRays{0%{opacity:0;transform:scale(.2) rotate(0deg)}18%{opacity:.95}72%{opacity:.8}100%{opacity:0;transform:scale(1.15) rotate(24deg)}}
@keyframes qjojoRaySpin{to{transform:rotate(360deg)}}

/* 金环冲击波 */
.jojo-goldring{position:absolute;left:50%;top:50%;border-radius:50%;opacity:0;
	border:2px solid rgba(255,224,138,.95);
	box-shadow:0 0 34px rgba(255,214,107,.95),inset 0 0 34px rgba(232,178,58,.7);
	transform:translate(-50%,-50%) scale(.15);
	animation:jojoGoldRing 1.25s cubic-bezier(.15,.7,.25,1) forwards}
@keyframes jojoGoldRing{0%{opacity:0;transform:translate(-50%,-50%) scale(.15)}
	10%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(2.9)}}

/* 黄金粒子：向心汇聚 + 上升 */
.jojo-golddust{position:absolute;width:7px;height:7px;border-radius:50%;opacity:0;
	background:radial-gradient(circle,#fff 0%,rgba(255,224,138,1) 38%,rgba(232,178,58,0) 74%);
	box-shadow:0 0 12px rgba(255,214,107,.95);
	animation:jojoGoldDust 1.6s ease-out forwards}
@keyframes jojoGoldDust{0%{opacity:0;transform:translate(0,0) scale(.3)}
	18%{opacity:1}
	76%{opacity:1}
	100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.5)}}

/* 生命环：纯金 */
.jojo-lifering{position:absolute;border-radius:50%;opacity:0;
	background:conic-gradient(from 0deg,transparent 0 38%,rgba(255,224,138,.95) 50%,rgba(255,255,255,1) 58%,rgba(232,178,58,.35) 72%,transparent 88%);
	-webkit-mask:radial-gradient(circle,transparent 56%,#000 60%,#000 92%,transparent 97%);
	mask:radial-gradient(circle,transparent 56%,#000 60%,#000 92%,transparent 97%);
	filter:drop-shadow(0 0 18px rgba(255,214,107,.95));
	animation:jojoLifeIn .6s ease-out forwards,jojoSpin 1.3s linear infinite}
@keyframes jojoLifeIn{to{opacity:1}}

/* 标题：鎏金 */
.jojo-title{position:absolute;left:50%;top:36%;transform:translate(-50%,-50%);
	font-size:62px;font-weight:900;letter-spacing:.14em;white-space:nowrap;opacity:0;
	background:linear-gradient(180deg,#fffbe8 0%,#ffe89a 26%,#f0c04a 52%,#c8912a 74%,#8a5c10 100%);
	-webkit-background-clip:text;background-clip:text;
	-webkit-text-fill-color:transparent;text-fill-color:transparent;
	filter:drop-shadow(0 0 22px rgba(255,214,107,.95)) drop-shadow(0 0 60px rgba(232,178,58,.85)) drop-shadow(0 3px 0 rgba(60,34,0,.9));
	animation:jojoTitle 1s cubic-bezier(.16,1,.3,1) forwards}
@keyframes jojoTitle{0%{opacity:0;transform:translate(-50%,-50%) scale(2.4);filter:blur(14px) drop-shadow(0 0 22px rgba(255,214,107,.95))}
	40%{opacity:1;filter:blur(0) drop-shadow(0 0 22px rgba(255,214,107,.95))}
	60%{transform:translate(-50%,-50%) scale(.96)}
	100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.jojo-sub{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);font-size:12px;letter-spacing:.52em;
	color:rgba(255,236,180,.92);white-space:nowrap;opacity:0;
	text-shadow:0 0 14px rgba(255,214,107,.95),0 0 34px rgba(232,178,58,.8);animation:jojoFade .5s ease-out .3s forwards}

/* 是 / 否 符文 */
.jojo-glyph{position:absolute;transform:translate(-50%,-50%);font-size:34px;font-weight:900;opacity:0;
	color:rgba(255,224,138,1);text-shadow:0 0 18px rgba(255,214,107,1),0 0 44px rgba(232,178,58,.85);
	animation:jojoGlyph .8s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes jojoGlyph{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}
	30%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}
	70%{opacity:1;transform:translate(-50%,-50%) scale(1)}
	100%{opacity:0;transform:translate(-50%,-140%) scale(.9)}}
`;

let _styleDone = false;
let _lastPlay = {};
let _sfxCache = {};

function cfg(key, dflt) {
	try {
		const v = lib.config[key];
		return v === undefined ? dflt : v;
	} catch (e) {
		return dflt;
	}
}

function injectStyle() {
	if (_styleDone) return;
	try {
		if (typeof document === "undefined") return;
		if (document.getElementById(STYLE_ID)) {
			_styleDone = true;
			return;
		}
		const s = document.createElement("style");
		s.id = STYLE_ID;
		s.textContent = CSS_TEXT;
		(document.head || document.body).appendChild(s);
		_styleDone = true;
	} catch (e) {}
}

function layer() {
	try {
		if (typeof document === "undefined" || !document.body) return null;
		let l = document.getElementById(LAYER_ID);
		if (!l) {
			injectStyle();
			l = document.createElement("div");
			l.id = LAYER_ID;
			document.body.appendChild(l);
		}
		return l;
	} catch (e) {
		return null;
	}
}

function topLayer() {
	try {
		if (typeof document === "undefined" || !document.body) return null;
		let l = document.getElementById(TOP_ID);
		if (!l) {
			injectStyle();
			l = document.createElement("div");
			l.id = TOP_ID;
			document.body.appendChild(l);
		}
		return l;
	} catch (e) {
		return null;
	}
}

function mk(cls, parent) {
	const p = parent || layer();
	if (!p) return null;
	const d = document.createElement("div");
	if (cls) d.className = cls;
	p.appendChild(d);
	return d;
}

function kill(node, ms) {
	if (!node) return;
	setTimeout(function () {
		try {
			node.remove();
		} catch (e) {}
	}, ms);
}

function rnd(n) {
	const x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
	return x - Math.floor(x);
}

function anchor(player) {
	try {
		if (!player) return null;
		const isMe = typeof game !== "undefined" && game.me && player === game.me;
		if (isMe) {
			if (ui.fakeme && ui.fakeme.getBoundingClientRect().width > 0) return ui.fakeme;
			if (ui.me && ui.me.getBoundingClientRect().width > 0) return ui.me;
		}
		if (player.node && player.node.avatar && player.node.avatar.getBoundingClientRect().width > 0) {
			return player.node.avatar;
		}
		if (player.node && player.node.avatar) return player.node.avatar;
		return player;
	} catch (e) {
		return null;
	}
}

function box(player) {
	const a = anchor(player);
	if (!a) return null;
	try {
		const r = a.getBoundingClientRect();
		if (!r || (!r.width && !r.height)) return null;
		return { x: r.left + r.width / 2, y: r.top + r.height / 2, w: r.width, h: r.height, rect: r };
	} catch (e) {
		return null;
	}
}

function screen() {
	try {
		if (typeof window === "undefined") return { x: 960, y: 540, w: 1920, h: 1080 };
		return { x: window.innerWidth / 2, y: window.innerHeight / 2, w: window.innerWidth, h: window.innerHeight };
	} catch (e) {
		return { x: 960, y: 540, w: 1920, h: 1080 };
	}
}

function playSfx(name, vol) {
	try {
		if (!name || typeof Audio !== "function") return;
		if (cfg(CFG_SFX, true) === false) return;
		if (lib.config.volume === 0) return;
		let base = _sfxCache[name];
		if (!base) {
			const override = typeof window !== "undefined" && window.__JOJO_AUDIO_BASE;
			base = new Audio((override || (lib.assetURL || "") + AUDIO_BASE) + name + ".mp3");
			base.preload = "auto";
			_sfxCache[name] = base;
		}
		const node = base.cloneNode();
		node.volume = Math.max(0, Math.min(1, vol === undefined ? 0.75 : vol));
		const p = node.play();
		if (p && p.catch) p.catch(function () {});
	} catch (e) {}
}

const fx = {
	get on() {
		return cfg(CFG_KEY, true) !== false;
	},

	play(name, args) {
		try {
			if (!this.on) return;
			const p = args && args[0];
			let key = name;
			if (p && p.node) key += "|" + (p.name1 || "") + "|" + (p.dataset ? p.dataset.position : "");
			if (name === "energy") key += "|" + (args[1] || 0);
			const now = Date.now();
			if (_lastPlay[key] && now - _lastPlay[key] < 150) return;
			if (Object.keys(_lastPlay).length > 200) _lastPlay = {};
			_lastPlay[key] = now;
			const fn = this[name];
			if (typeof fn === "function") return fn.apply(this, args || []);
		} catch (e) {}
	},

	sound(name, vol) {
		playSfx(name, vol);
	},

	/* ---------------- 基础 ---------------- */

	ring(player, opt) {
		opt = opt || {};
		const b = box(player);
		if (!b) return;
		const d = mk("jojo-ring");
		if (!d) return;
		const s = opt.size || Math.max(80, Math.min(200, b.w * 1.2));
		d.style.left = b.x + "px";
		d.style.top = b.y + "px";
		d.style.width = s + "px";
		d.style.height = s + "px";
		kill(d, 800);
	},

	float(player, text, opt) {
		if (!text) return;
		opt = opt || {};
		const b = opt.atScreen ? screen() : box(player);
		if (!b) return;
		const d = mk("jojo-float");
		if (!d) return;
		d.textContent = text;
		d.style.left = b.x + "px";
		d.style.top = (b.y + (opt.dy || 0)) + "px";
		d.style.fontSize = (opt.size || 15) + "px";
		d.style.color = opt.color || "#eaffe8";
		kill(d, 1200);
	},

	spark(player, opt) {
		opt = opt || {};
		const b = opt.atScreen ? screen() : box(player);
		if (!b) return;
		const n = Math.max(1, Math.min(24, opt.count || 10));
		for (let i = 0; i < n; i++) {
			const d = mk("jojo-spark");
			if (!d) return;
			d.style.left = b.x + (rnd(i * 7) - 0.5) * (opt.spread || 90) + "px";
			d.style.top = b.y + (rnd(i * 11) - 0.5) * (opt.spread || 90) + "px";
			d.style.setProperty("--dx", ((rnd(i * 13) - 0.5) * 60).toFixed(0) + "px");
			d.style.setProperty("--dy", (-24 - rnd(i * 17) * 46).toFixed(0) + "px");
			d.style.animationDelay = (i * 0.025).toFixed(3) + "s";
			kill(d, 900);
		}
	},

	/* ---------------- 精神能量 ---------------- */

	energy(player, count) {
		this.sound("jojo_energy", 0.45);
		const b = box(player);
		if (!b) return;
		// 金色生命火花从四周向角色汇聚
		for (let i = 0; i < 7; i++) {
			const d = mk("jojo-spark");

	},

	/* ---------------- 黄金体验：三选一 ---------------- */

	convert(player, key) {
		const b = box(player);
		if (!b) return;
		this.sound("jojo_bloom", 0.6);
		if (key === "tao") {
			// 赋予生命 → 治疗：花与叶从身上绽开
			for (let i = 0; i < 12; i++) {
				const d = mk("jojo-bloom");
				if (!d) return;
				d.style.left = b.x + "px";
				d.style.top = b.y + "px";
				d.style.setProperty("--r", Math.round(rnd(i * 5) * 360) + "deg");
				d.style.setProperty("--d", (-(30 + rnd(i * 9) * 70)).toFixed(0) + "px");
				d.style.animationDelay = i * 0.03 + "s";
				kill(d, 1000);
			}
			this.float(player, "黄金体验·生命", { color: GREEN_L, size: 15 });
			this.spark(player, { count: 14, spread: 70 });
			return;
		}
		if (key === "distance") {
			// 藤蔓栅栏长在身前
			const host = player;
			if (host && host.appendChild) {
				const wrap = document.createElement("div");
				wrap.className = "jojo-vinewrap";
				wrap.style.cssText =
					"position:absolute;overflow:visible;pointer-events:none;z-index:5;left:" +
					(b.rect.left - (host.getBoundingClientRect().left || 0) - 40) +
					"px;top:" +
					(b.rect.top - (host.getBoundingClientRect().top || 0) + b.h * 0.45) +
					"px;width:80px;height:" +
					b.h * 0.5 +
					"px";
				host.appendChild(wrap);
				for (let i = 0; i < 6; i++) {
					const v = document.createElement("div");
					v.className = "jojo-vine";
					v.style.left = i * 13 + 4 + "px";
					v.style.setProperty("--h", 40 + rnd(i * 3) * 60 + "%");
					v.style.animationDelay = i * 0.05 + "s";
					wrap.appendChild(v);
					const leaf = document.createElement("div");
					leaf.className = "jojo-leaf";
					leaf.style.left = i * 13 - 2 + "px";
					leaf.style.bottom = 52 + rnd(i * 7) * 34 + "%";
					leaf.style.setProperty("--r", Math.round((rnd(i * 11) - 0.5) * 70) + "deg");
					leaf.style.animationDelay = 0.25 + i * 0.05 + "s";
					wrap.appendChild(leaf);
				}
				const start = Date.now();
				const tm = setInterval(function () {
					let alive = false;
					try {
						alive = wrap.isConnected && (Date.now() - start < 1500 || player.hasSkill("jojo_giorno_distance"));
					} catch (e) {
						alive = false;
					}
					if (!alive) {
						clearInterval(tm);
						try {
							wrap.remove();
						} catch (e) {}
					}
				}, 900);
			}
			this.float(player, "藤蔓·距离+1", { color: GREEN_L, size: 14 });
			return;
		}
		if (key === "armor") {
			this.float(player, "黄金反甲", { color: GOLD_L, size: 15 });
			this.shell(player);
		}
	},

	/* ---------------- 黄金反甲：瓢虫壳 ---------------- */

	shell(player) {
		if (!player || !player.appendChild) return;
		try {
			const old = player.querySelector(".jojo-shell");
			if (old) old.remove();
		} catch (e) {}
		const a = anchor(player);
		if (!a) return;
		this.sound("jojo_armor", 0.6);
		try {
			const ar = a.getBoundingClientRect();
			const pr = player.getBoundingClientRect();
			if (!ar.width) return;
			const d = document.createElement("div");
			d.className = "jojo-shell";
			d.style.left = ar.left - pr.left - 5 + "px";
			d.style.top = ar.top - pr.top - 5 + "px";
			d.style.width = ar.width + 10 + "px";
			d.style.height = ar.height + 10 + "px";
			// 瓢虫斑（左右各三枚）
			const spots = [
				[0.3, 0.28], [0.3, 0.5], [0.3, 0.72],
				[0.7, 0.28], [0.7, 0.5], [0.7, 0.72],
			];
			for (const [sx, sy] of spots) {
				const b2 = document.createElement("b");
				b2.style.left = sx * 100 + "%";
				b2.style.top = sy * 100 + "%";
				b2.style.transform = "translate(-50%,-50%)";
				d.appendChild(b2);
			}
			player.appendChild(d);
			const born = Date.now();
			const tm = setInterval(function () {
				let alive = false;
				try {
					alive = d.isConnected && (Date.now() - born < 1500 || player.hasSkill("jojo_giorno_armor"));
				} catch (e) {
					alive = false;
				}
				if (!alive) {
					clearInterval(tm);
					try {
						d.remove();
					} catch (e) {}
				}
			}, 900);
			d._jojoTimer = tm;
		} catch (e) {}
	},

	shellClear(player) {
		try {
			const d = player.querySelector(".jojo-shell");
			if (d) {
				if (d._jojoTimer) clearInterval(d._jojoTimer);
				d.classList.add("break");
				kill(d, 420);
			}
		} catch (e) {}
	},

	/* ---------------- 反甲触发：把伤害弹回去 ---------------- */

	reflect(player, source) {
		this.sound("jojo_reflect", 0.7);
		const A = box(player);
		const B = box(source);
		// 壳先亮一下
		this.ring(player, { size: 150 });
		if (!A || !B) return;
		const dx = B.x - A.x;
		const dy = B.y - A.y;
		const len = Math.sqrt(dx * dx + dy * dy) || 1;
		const ang = (Math.atan2(dy, dx) * 180) / Math.PI;
		const d = mk("jojo-beam");
		if (!d) return;
		d.style.left = A.x + "px";
		d.style.top = A.y - 4 + "px";
		d.style.transform = "rotate(" + ang + "deg)";
		requestAnimationFrame(function () {
			try {
				d.style.opacity = "1";
				d.style.width = len + "px";
			} catch (e) {}
		});
		setTimeout(function () {
			try {
				d.style.opacity = "0";
			} catch (e) {}
		}, 150);
		kill(d, 560);
		setTimeout(() => {
			try {
				this.sound("jojo_hit", 0.65);
				this.spark(source, { count: 12, spread: 60 });
				this.float(source, "生命反弹", { color: GREEN_L, size: 14 });
			} catch (e) {}
		}, 200);
	},

	/* ---------------- 跳过摸牌：藤蔓封锁 ---------------- */

	skipDraw(target) {
		if (!target) return;
		this.sound("jojo_seal", 0.65);

		if (!b) return;

			d.style.top = b.rect.top + b.h * 0.5 + "px";
			d.style.bottom = "auto";
			d.style.setProperty("--h", (30 + rnd(i * 5) * 50) + "px");
			d.style.transformOrigin = "50% 0";
			d.style.animationDelay = i * 0.04 + "s";
			kill(d, 1200);
		}
		const s = mk("jojo-seal");
		if (s) {
			s.textContent = "跳过摸牌";

			s.style.top = b.y + "px";
			kill(s, 1000);
		}

	/* ---------------- 虫箭 ---------------- */

	arrow(from, to, mode) {
		this.sound("jojo_arrow", 0.7);
		const A = from ? box(from) : { x: screen().x, y: -80 };
		const B = to ? box(to) : { x: screen().x, y: screen().y * 0.55 };
		if (!A || !B) return;
		const s = mk("jojo-arrow");
		if (!s) return;
		const size = mode === "shuffle" ? 150 : 110;
		s.style.width = size * 0.08 + "px";
		s.style.height = size + "px";
		s.style.left = A.x + "px";
		s.style.top = A.y + "px";
		s.style.opacity = "0";
		s.style.transform = "translate(-50%,-100%) scale(.5)";
		try {
			const anim = s.animate(
				[
					{ transform: "translate(-50%,-100%) translateY(-160px) scale(.5)", opacity: "0" },
					{ transform: "translate(-50%,-100%) translateY(0) scale(1)", opacity: "1", offset: 0.42 },
					{ transform: "translate(-50%,-100%) translateY(24px) scale(1)", opacity: "1", offset: 0.72 },
					{ transform: "translate(-50%,-100%) translateY(30px) scale(.85)", opacity: "0" },
				],
				{ duration: 620, easing: "cubic-bezier(.3,0,.2,1)", fill: "forwards" }
			);
			anim.onfinish = function () {
				setTimeout(function () {
					try {
						s.remove();
					} catch (e) {}
				}, 40);
			};
		} catch (e) {
			kill(s, 700);
		}
		kill(s, 1200);
		if (mode === "shuffle") {
			setTimeout(() => this.spark(null, { count: 14, spread: 80, atScreen: true }), 520);
		} else {
			const b = box(to || from);
			if (b) {
				const t = mk("jojo-ring");
				if (t) {
					t.style.left = b.x + "px";
					t.style.top = b.y + "px";
					t.style.width = "130px";
					t.style.height = "130px";
					t.style.animationDelay = ".5s";
					kill(t, 1200);
				}
			}
		}
	},

	/* ---------------- 镇魂曲觉醒（黄金大特效） ---------------- */

	awaken(player) {
		const l = topLayer();
		if (!l) return;
		const self = this;
		const TOTAL = 4100;
		const root = document.createElement("div");
		root.style.cssText = "position:absolute;left:0;top:0;width:100%;height:100%;overflow:hidden";
		l.appendChild(root);
		const add = function (cls, style) {
			const d = document.createElement("div");
			if (cls) d.className = cls;
			if (style) d.style.cssText = style;
			root.appendChild(d);
			return d;
		};

		add("jojo-dim");
		this.sound("jojo_awaken", 0.95);

		const sc = screen();

		/* --- 第一段：黄金放射光从角色身后绽开 --- */
		const rays = add("jojo-rays");
		rays.style.left = b.x + "px";

		const pillar2 = add("jojo-pillar");

		pillar2.style.width = "68px";
		pillar2.style.animationDelay = ".12s";
		pillar2.style.opacity = "0";

		/* --- 第二段：巨箭贯穿 --- */
		const arrow = add("jojo-arrow");

		arrow.style.opacity = "1";
		try {
			arrow.animate(
				[
					{ transform: "translate(-50%,-100%) translateY(-280px) scale(.7)", opacity: "0" },
					{ transform: "translate(-50%,-100%) translateY(0) scale(1)", opacity: "1", offset: 0.5 },
					{ transform: "translate(-50%,-100%) translateY(340px) scale(1)", opacity: "1", offset: 0.9 },

				],

			);

		/* --- 第三段：命中瞬间 —— 白闪 + 三圈金环冲击波 + 黄金粒子喷发 --- */
		const impact = 1080;

				self.sound("jojo_hit", 0.85);

				// 三圈金环，错开扩散
				for (let i = 0; i < 3; i++) {
					(function (k) {
						setTimeout(function () {
							try {
								const r = add("jojo-goldring");
								const s2 = Math.max(b.w, b.h) * (1.6 + k * 0.55);
								r.style.left = b.x + "px";
								r.style.top = b.y + "px";
								r.style.width = s2 + "px";
								r.style.height = s2 + "px";
								kill(r, 1600);
							} catch (e) {}
						}, k * 110);
					})(i);
				}

				// 黄金粒子：全屏向角色汇聚后再向上飘散
				for (let i = 0; i < 34; i++) {
					const d = add("jojo-golddust");
					const ang = rnd(i * 3.1) * Math.PI * 2;
					const dist = 180 + rnd(i * 7.7) * 340;
					d.style.left = b.x + Math.cos(ang) * dist + "px";
					d.style.top = b.y + Math.sin(ang) * dist + "px";
					d.style.setProperty("--dx", (-Math.cos(ang) * dist * 0.85).toFixed(0) + "px");

				r.style.left = b.x + "px";
				r.style.top = b.y + "px";
				r.style.width = s2 + "px";
				r.style.height = s2 + "px";

				r.style.marginTop = -s2 / 2 + "px";

			try {
				const t = add("jojo-title");
				t.textContent = "黄金体验镇魂曲";
				const s2 = add("jojo-sub");
				s2.textContent = "GOLDEN EXPERIENCE REQUIEM";
			} catch (e) {}

		/* --- 第六段：二次金色扫光，收束 --- */
		setTimeout(function () {

				const s2 = Math.max(sc.w, sc.h) * 1.6;

				sweep.style.top = sc.y + "px";

				sweep.style.height = s2 + "px";

				kill(sweep, 1600);

		setTimeout(function () {
			try {
				root.style.transition = "opacity .7s ease";
				root.style.opacity = "0";
			} catch (e) {}
		}, TOTAL - 750);
		kill(root, TOTAL);
	},

	/* ---------------- Canvas 粒子 ---------------- */

	burst(player, opt) {
		opt = opt || {};
		const l = topLayer();
		if (!l) return;
		const b = opt.atScreen ? screen() : box(player);
		if (!b) return;
		const W = l.clientWidth || 1920;
		const H = l.clientHeight || 1080;
		const cv = document.createElement("canvas");
		cv.width = W;
		cv.height = H;
		cv.style.cssText = "position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none";
		l.appendChild(cv);
		const ctx = typeof cv.getContext === "function" ? cv.getContext("2d") : null;
		if (!ctx) {
			try {
				cv.remove();
			} catch (e) {}
			return;
		}
		const n = Math.max(1, Math.min(140, opt.count || 50));
		const colors = ["rgba(255,224,138,1)", "rgba(123,224,138,1)", "rgba(63,164,91,.95)"];
		const parts = [];
		for (let i = 0; i < n; i++) {
			const a = Math.random() * Math.PI * 2;
			const sp = 1.2 + Math.random() * 5;
			parts.push({
				x: b.x,
				y: b.y,
				vx: Math.cos(a) * sp,
				vy: Math.sin(a) * sp - 1,
				r: 1 + Math.random() * 2.4,
				c: colors[Math.floor(Math.random() * colors.length)],
			});
		}
		const t0 = Date.now();
		const dur = opt.duration || 950;
		const step = function () {
			const k = (Date.now() - t0) / dur;
			if (k >= 1) {
				try {
					cv.remove();
				} catch (e) {}
				return;
			}
			ctx.clearRect(0, 0, W, H);
			ctx.globalCompositeOperation = "lighter";
			for (let i = 0; i < parts.length; i++) {
				const p = parts[i];
				p.x += p.vx;
				p.y += p.vy;
				p.vy += 0.1;
				p.vx *= 0.986;
				p.vy *= 0.986;
				ctx.globalAlpha = Math.max(0, 1 - k * 1.15);
				ctx.fillStyle = p.c;
				ctx.beginPath();
				ctx.arc(p.x, p.y, Math.max(0.3, p.r * (1 - k * 0.5)), 0, Math.PI * 2);
				ctx.fill();
			}
			if (typeof requestAnimationFrame === "function") requestAnimationFrame(step);
		};
		if (typeof requestAnimationFrame === "function") requestAnimationFrame(step);
	},
};
